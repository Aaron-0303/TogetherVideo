<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#11131a"/><title>TogetherVideo</title><link rel="manifest" href="/manifest.webmanifest"/><link rel="stylesheet" href="/styles.css"/></head>
<body>
<div id="loginLayer" class="login-layer hidden"><form id="loginForm" class="login-card"><div class="heart-mark">♥</div><p class="eyebrow">PRIVATE WATCH ROOM</p><h1>一起看，就像坐在一起</h1><p class="muted">输入昵称和访问密码。视频来自 OpenList，本站只负责同步，不中转视频流。</p><label>你的昵称<input id="nicknameInput" maxlength="20" autocomplete="nickname" placeholder="例如：旭旭" required/></label><label>访问密码<input id="passwordInput" type="password" autocomplete="current-password" placeholder="站点密码" required/></label><button class="primary wide" type="submit">进入我们的影院</button><p id="loginError" class="error-text"></p></form></div>
<div id="app" class="app-shell hidden">
<header class="topbar"><div class="brand"><span class="brand-heart">♥</span><span>TogetherVideo</span></div><div class="room-actions"><span id="connectionBadge" class="status-badge">连接中</span><button id="copyRoomBtn" class="ghost small">复制房间链接</button><button id="logoutBtn" class="ghost small">退出</button></div></header>
<main class="layout">
<aside id="libraryPanel" class="panel library-panel"><div class="panel-title-row"><div><p class="eyebrow">LIBRARY</p><h2>片库</h2></div><button id="refreshLibraryBtn" class="icon-btn" title="刷新">↻</button></div><div id="breadcrumbs" class="breadcrumbs"></div><div id="libraryStatus" class="muted compact">正在读取 OpenList...</div><div id="libraryList" class="library-list"></div></aside>
<section class="watch-column"><div class="player-card"><div class="player-head"><div><p class="eyebrow">NOW WATCHING</p><h2 id="mediaTitle">选择一集开始</h2></div><div id="driftBadge" class="drift-badge">已同步</div></div><div class="video-wrap"><video id="video" controls playsinline preload="metadata"></video><div id="emptyPlayer" class="empty-player"><span class="play-orbit">▶</span><strong>从左侧片库选择视频</strong><span>你选择的剧集会同步给房间里的另一位</span></div><button id="resumeOverlay" class="resume-overlay hidden">点击继续同步播放</button><div id="reactionLayer" class="reaction-layer"></div></div><div class="room-strip"><div><span class="room-label">房间</span><strong id="roomCodeText">ours</strong></div><div id="members" class="members"></div><button id="syncNowBtn" class="secondary">立即跟随</button></div><div class="reactions"><span class="muted compact">一起反应</span><button data-reaction="❤️">❤️</button><button data-reaction="😂">😂</button><button data-reaction="😭">😭</button><button data-reaction="😮">😮</button><button data-reaction="🥰">🥰</button></div><p id="playerNotice" class="notice"></p></div></section>
<aside class="panel chat-panel"><div class="panel-title-row"><div><p class="eyebrow">TOGETHER</p><h2>聊天</h2></div><span id="onlineCount" class="online-count">0 在线</span></div><div id="chatMessages" class="chat-messages"></div><form id="chatForm" class="chat-form"><input id="chatInput" maxlength="300" placeholder="说点什么..." autocomplete="off"/><button class="primary" type="submit">发送</button></form></aside>
</main></div>
<script src="/socket.io/socket.io.js"></script><script src="/vendor/hls/hls.min.js"></script><script src="/app.js"></script></body></html>
