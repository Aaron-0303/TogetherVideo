services:
  together-video:
    build: .
    container_name: together-video
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    depends_on:
      - openlist

  openlist:
    image: openlistteam/openlist:latest
    container_name: openlist
    restart: unless-stopped
    user: "0:0"
    environment:
      UMASK: "022"
    ports:
      - "5244:5244"
    volumes:
      - ./openlist-data:/opt/openlist/data
